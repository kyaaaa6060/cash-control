<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Control Engine - Live Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- TradingView Widget Script -->
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-emerald-400">⚡ CASH CONTROL ENGINE</h1>
        <div class="flex items-center gap-4">
            <select id="coinSelect" onchange="changeCoin()" class="bg-slate-800 border border-slate-700 text-white rounded px-3 py-1.5 focus:outline-none focus:border-emerald-500">
                <option value="">Coinler Yükleniyor...</option>
            </select>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
        <!-- Sol & Orta: TradingView Grafik Alanı -->
        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col h-[600px]">
            <div class="flex justify-between items-center mb-3">
                <h2 id="chartTitle" class="text-lg font-semibold text-slate-300">Grafik - Yükleniyor...</h2>
                <span id="markPriceVal" class="text-emerald-400 font-mono font-bold">$0.00</span>
            </div>
            <!-- TradingView Widget Container -->
            <div id="tradingview_chart" class="w-full flex-1 rounded bg-slate-950 overflow-hidden"></div>
        </div>

        <!-- Sağ: Panel Verileri ve Kaynaklar -->
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col justify-between">
            <div>
                <h2 class="text-lg font-semibold text-slate-300 mb-3">Piyasa Analiz Paneli</h2>
                <div id="panelContent" class="space-y-3 text-sm font-mono text-slate-400">
                    <p>Veriler bekleniyor...</p>
                </div>
            </div>
            <div class="mt-4 pt-3 border-t border-slate-800 text-xs text-slate-500 text-center">
                Cash Control Core v13.9 - Active Connection
            </div>
        </div>
    </main>

    <!-- JavaScript Mantığı -->
    <script>
        let tvWidget = null;
        let currentSymbol = "BTC";

        async function loadCoins() {
            try {
                let res = await fetch('/api/coins');
                let data = await res.json();
                if (data.status === "success" && data.coins.length > 0) {
                    let select = document.getElementById('coinSelect');
                    select.innerHTML = "";
                    data.coins.forEach(coin => {
                        let opt = document.createElement('option');
                        opt.value = coin;
                        opt.innerText = coin + "/USDT";
                        if(coin === "BTC") opt.selected = true;
                        select.appendChild(opt);
                    });
                    loadMarketStats(currentSymbol);
                }
            } catch (err) {
                console.error("Coinler yüklenirken hata:", err);
            }
        }

        async function loadMarketStats(symbol) {
            currentSymbol = symbol;
            try {
                let res = await fetch(`/api/market-stats/${symbol}`);
                let json = await res.json();
                if (json.status === "success") {
                    let d = json.data;
                    document.getElementById('chartTitle').innerText = `${d.symbol} Analizi`;
                    document.getElementById('markPriceVal').innerText = `$${d.markPrice.toLocaleString()}`;
                    
                    let panelHtml = `<div class="p-2 bg-slate-800 rounded">Funding Rate: <span class="text-white">${d.fundingRate.toFixed(4)}%</span></div>`;
                    panelHtml += `<div class="p-2 bg-slate-800 rounded">Open Interest: <span class="text-white">$${Math.round(d.openInterestUSD).toLocaleString()}</span></div>`;
                    
                    if(d.ai_analysis) {
                        panelHtml += `<div class="p-2 bg-emerald-950 border border-emerald-800 rounded text-emerald-300">Sinyal: ${d.ai_analysis.signal}</div>`;
                    }
                    document.getElementById('panelContent').innerHTML = panelHtml;

                    initTradingView(d.symbol);
                }
            } catch (err) {
                console.error("İstatistikler yüklenirken hata:", err);
            }
        }

        function initTradingView(symbol) {
            document.getElementById('tradingview_chart').innerHTML = "";
            new TradingView.widget({
                "autosize": true,
                "symbol": "BINANCE:" + symbol,
                "interval": "15",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "tr",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "container_id": "tradingview_chart"
            });
        }

        function changeCoin() {
            let val = document.getElementById('coinSelect').value;
            if(val) {
                loadMarketStats(val);
            }
        }

        // Sayfa açıldığında çalıştır ve her 5 saniyede bir güncelle
        loadCoins();
        setInterval(() => {
            let val = document.getElementById('coinSelect').value;
            if(val) loadMarketStats(val);
        }, 5000);
    </script>
</body>
</html>
