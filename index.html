    <script>
        let currentSymbol = "BTC";
        let currentSource = "trak";
        let autoInterval = null;

        let chart;
        let candleSeries;
        let entryLine, tpLine, slLine;

        function togglePanel() {
            let modal = document.getElementById('panelModal');
            modal.classList.toggle('hidden');
            // Panel açıldığında grafiğin boyutunu yenile (siyah ekranı önler)
            if(chart) {
                setTimeout(() => {
                    let container = document.getElementById('tradingview-container');
                    chart.resize(container.clientWidth, container.clientHeight);
                }, 100);
            }
        }

        function initChart() {
            let container = document.getElementById('tradingview-container');
            container.innerHTML = ''; 
            
            chart = LightweightCharts.createChart(container, {
                width: container.clientWidth,
                height: container.clientHeight,
                layout: { background: { type: 'solid', color: '#0b0e11' }, textColor: '#eaeaea' },
                grid: { vertLines: { color: '#1e2329' }, horzLines: { color: '#1e2329' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#2b2b2b' },
                rightPriceScale: { borderColor: '#2b2b2b' }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#0ecb81', downColor: '#f6465d',
                borderVisible: false,
                wickUpColor: '#0ecb81', wickDownColor: '#f6465d'
            });

            window.addEventListener('resize', () => {
                chart.resize(container.clientWidth, container.clientHeight);
            });
        }

        async function fetchCandleData(symbol) {
            try {
                let formattedSymbol = symbol + "USDT";
                let response = await fetch(`https://api.binance.com/api/v3/klines?symbol=${formattedSymbol}&interval=15m&limit=200`);
                let data = await response.json();
                
                let chartData = data.map(d => ({
                    time: d[0] / 1000,
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));
                candleSeries.setData(chartData);
                chart.timeScale().fitContent(); // Grafiği ekrana sığdır
            } catch (err) {
                console.error("Grafik verisi alınamadı:", err);
            }
        }

        function drawStrategyLines(entryPrice, tpPrice, slPrice) {
            if(!candleSeries) return;

            if(entryLine) candleSeries.removePriceLine(entryLine);
            if(tpLine) candleSeries.removePriceLine(tpLine);
            if(slLine) candleSeries.removePriceLine(slLine);

            if(entryPrice) {
                entryLine = candleSeries.createPriceLine({
                    price: parseFloat(entryPrice),
                    color: '#f0b90b', lineWidth: 2, lineStyle: 2,
                    axisLabelVisible: true, title: 'ENTRY'
                });
            }
            if(tpPrice) {
                tpLine = candleSeries.createPriceLine({
                    price: parseFloat(tpPrice),
                    color: '#0ecb81', lineWidth: 2, lineStyle: 2,
                    axisLabelVisible: true, title: 'TP'
                });
            }
            if(slPrice) {
                slLine = candleSeries.createPriceLine({
                    price: parseFloat(slPrice),
                    color: '#f6465d', lineWidth: 2, lineStyle: 2,
                    axisLabelVisible: true, title: 'SL'
                });
            }
        }

        async function loadCoins() {
            try {
                let res = await fetch('/api/coins');
                let data = await res.json();
                if(data.status === 'success' && data.coins.length > 0) {
                    let select = document.getElementById('coinSelect');
                    select.innerHTML = '';
                    
                    data.coins.forEach(coin => {
                        let opt = document.createElement('option');
                        opt.value = coin;
                        opt.text = coin + "USDT";
                        select.appendChild(opt);
                    });
                    
                    // İlk açılışta kesinlikle BTC seçilmesi sağlandı
                    if (data.coins.includes("BTC")) {
                        currentSymbol = "BTC";
                    } else {
                        currentSymbol = data.coins[0];
                    }
                    select.value = currentSymbol;
                    
                    if(currentSymbol) {
                        initChart();
                        await fetchCandleData(currentSymbol);
                        fetchStats(currentSymbol);
                        startRealtimeSync();
                    }
                }
            } catch(e) {
                console.error("Coinler yüklenemedi", e);
            }
        }

        async function fetchStats(symbol) {
            try {
                let res = await fetch(`/api/market-stats/${symbol}`);
                let json = await res.json();
                if(json.status === 'success') {
                    let d = json.data;
                    let ai = d.ai_analysis;
                    
                    document.getElementById('markPrice').innerText = "$" + d.markPrice;
                    
                    document.getElementById('aiComment').innerText = ai.comment || "Analiz bulunamadı.";
                    document.getElementById('valEntry').innerText = "$" + ai.entry;
                    document.getElementById('valTP').innerText = "$" + ai.tp;
                    document.getElementById('valSL').innerText = "$" + ai.sl;
                    
                    drawStrategyLines(ai.entry, ai.tp, ai.sl);
                    
                    let srcData = d.sources[currentSource] || d.sources["trak"];
                    if(srcData) {
                        document.getElementById('longVal').innerText = "$" + srcData.long_avg;
                        document.getElementById('longSub').innerText = `(${srcData.long_count} işlem, $${srcData.long_size.toFixed(1)}K size)`;
                        
                        document.getElementById('shortVal').innerText = "$" + srcData.short_avg;
                        document.getElementById('shortSub').innerText = `(${srcData.short_count} işlem, $${srcData.short_size.toFixed(1)}K size)`;
                        
                        document.getElementById('avgVal').innerText = "$" + srcData.general_avg;
                    }
                    
                    let now = new Date();
                    document.getElementById('currentTime').innerText = now.toLocaleDateString('tr-TR') + " " + now.toLocaleTimeString('tr-TR') + " (TRT)";
                }
            } catch(e) {
                console.error("Veri çekme hatası:", e);
            }
        }

        async function onCoinChange() {
            let select = document.getElementById('coinSelect');
            currentSymbol = select.value;
            await fetchCandleData(currentSymbol);
            fetchStats(currentSymbol);
        }

        function setSource(src, element) {
            document.querySelectorAll('.src-btn').forEach(b => b.classList.remove('active'));
            element.classList.add('active');
            currentSource = src;
            fetchStats(currentSymbol);
        }

        function manualRefresh() {
            fetchCandleData(currentSymbol);
            fetchStats(currentSymbol);
        }

        function startRealtimeSync() {
            if(autoInterval) clearInterval(autoInterval);
            let secondsLeft = 5;
            autoInterval = setInterval(() => {
                secondsLeft--;
                if(secondsLeft <= 0) {
                    secondsLeft = 5;
                    if(currentSymbol) {
                        fetchStats(currentSymbol);
                    }
                }
                let countEl = document.getElementById('refreshCountdown');
                if(countEl) countEl.innerText = secondsLeft + "s";
            }, 1000);
        }

        window.onload = () => {
            loadCoins();
        };
    </script>
