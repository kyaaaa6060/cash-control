<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Paneli</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 24px;
            text-align: center;
            color: #38bdf8;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #38bdf8;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        .error-message {
            color: #ef4444;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
        .dashboard {
            display: none;
            text-align: center;
        }
        .dashboard h1 {
            color: #22c55e;
            margin-bottom: 20px;
        }
        .logout-btn {
            background-color: #ef4444;
            color: white;
            margin-top: 20px;
        }
        .logout-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div id="loginFormSection">
            <h2>Giriş Yap</h2>
            <div class="form-group">
                <label for="password">Şifre</label>
                <input type="password" id="password" placeholder="Şifrenizi girin">
            </div>
            <button onclick="handleLogin()">Giriş Yap</button>
            <div id="errorMsg" class="error-message"></div>
        </div>

        <div id="dashboardSection" class="dashboard">
            <h1>Giriş Başarılı!</h1>
            <p>Sisteme başarıyla giriş yaptınız.</p>
            <button class="logout-btn" onclick="handleLogout()">Çıkış Yap</button>
        </div>
    </div>

    <script>
        // Sayfa yüklendiğinde hafızadaki oturum durumunu kontrol et
        window.onload = function() {
            if (localStorage.getItem("isLoggedIn") === "true") {
                showDashboard();
            }
        };

        function handleLogin() {
            const passwordInput = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            // Kabul edilen şifreler (İstediğiniz şifreleri buraya yazabilirsiniz)
            const validPasswords = ["1453", "1234"];

            if (validPasswords.includes(passwordInput)) {
                localStorage.setItem("isLoggedIn", "true");
                errorMsg.textContent = "";
                showDashboard();
            } else {
                errorMsg.textContent = "Hatalı şifre! Lütfen tekrar deneyin.";
            }
        }

        function showDashboard() {
            document.getElementById("loginFormSection").style.display = "none";
            document.getElementById("dashboardSection").style.display = "block";
        }

        function handleLogout() {
            localStorage.removeItem("isLoggedIn");
            document.getElementById("password").value = "";
            document.getElementById("dashboardSection").style.display = "none";
            document.getElementById("loginFormSection").style.display = "block";
        }
    </script>
</body>
</html>
