<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Control - Trading Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Üst Bar / Panel -->
    <div class="control-panel">
        <div class="panel-header">
            <span class="title">⚡ BINANCE SMART MONEY & ORTALAMALAR</span>
            <span class="time">02.09.2026 12:53:50 (TRT)</span>
        </div>

        <!-- BEYAZ ALAN: Sadece Ortalama Girişler Kaldı (Liq Buradan Çıkarıldı) -->
        <div class="white-box-container">
            <div class="avg-item">
                <span class="label">LONG ORT. GİRİŞ</span>
                <span class="value long-val">$59,520.00</span>
            </div>
            <div class="avg-item">
                <span class="label">SHORT ORT. GİRİŞ</span>
                <span class="value short-val">$60,480.00</span>
            </div>
        </div>

        <!-- Diğer Panel Verileri -->
        <div class="panel-stats">
            <div class="stat-row">
                <span>Long Pozisyon (AUM):</span>
                <span class="green">$1.16B</span>
            </div>
            <div class="stat-row">
                <span>Short Pozisyon (AUM):</span>
                <span class="red">$459.48M</span>
            </div>
            <!-- Likidite artık grafik üzerinde ve tıklanabilir -->
            <div class="stat-row clickable" onclick="openLiquidityDetail()">
                <span>Tahmini Likidasyon (Grafikte):</span>
                <span class="liq-link">$52,200.00 ↗</span>
            </div>
        </div>
    </div>

    <!-- Grafik Alanı -->
    <div id="chart-container">
        <!-- Grafik ve Liq çizgileri buraya render edilecek -->
    </div>

    <script src="app.js"></script>
</body>
</html>
